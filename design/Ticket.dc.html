<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@200;300;400;500;600;700&display=swap">
  <style>
    body { margin: 0; background: #060606; }
    a { color: #ffcc33; } a:hover { color: #e63030; }
  </style>
</helmet>

<div style="width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #060606; font-family: 'Oswald', 'Liberation Sans', sans-serif;">

  <div style="position: absolute; top: 0; left: 0; right: 0; height: 8px; background: linear-gradient(90deg, #1a7a2e 0%, #2db84a 30%, #b22222 70%, #e63030 100%);"></div>

  <div style="position: absolute; inset: 8px 0 0 0; display: flex; flex-direction: column; padding: 58px 72px 58px 72px; gap: 38px;">

    <!-- Kopfzeile -->
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 20px;">
      <div style="font-size: 30px; font-weight: 500; color: #ffffff; letter-spacing: 7px; line-height: 1;">TSV PILSTING · DART</div>
      <img src="logo.png" alt="TSV Pilsting e.V." style="width: 70px; height: 70px; object-fit: contain;">
    </div>

    <!-- Ticket-Karte -->
    <div style="position: relative; flex-grow: 1; background: #0d0d0d; border: 1px solid rgba(255,255,255,.09); border-radius: 16px; display: flex; flex-direction: column;">

      <!-- oberer Abschnitt -->
      <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; padding: 54px 48px;">
        <div style="font-size: 22px; font-weight: 300; color: #2db84a; letter-spacing: 11px; text-transform: uppercase;">Competition</div>
        <div style="width: 190px; height: 190px; clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); background: linear-gradient(135deg, #2db84a, #1a7a2e); display: flex; align-items: center; justify-content: center;">
          <div style="font-size: 108px; font-weight: 600; color: #ffffff; line-height: 1;">1.</div>
        </div>
        <div style="font-size: 92px; font-weight: 500; color: #ffffff; letter-spacing: 4px; line-height: 1.08; text-align: center; text-wrap: balance;">DART COMPETITION</div>
      </div>

      <!-- Perforation -->
      <div style="position: relative; height: 0;">
        <div style="position: absolute; left: 44px; right: 44px; top: -1px; border-top: 2px dashed rgba(255,255,255,.14);"></div>
        <div style="position: absolute; left: -23px; top: -23px; width: 46px; height: 46px; border-radius: 50%; background: #060606; border-right: 1px solid rgba(255,255,255,.09);"></div>
        <div style="position: absolute; right: -23px; top: -23px; width: 46px; height: 46px; border-radius: 50%; background: #060606; border-left: 1px solid rgba(255,255,255,.09);"></div>
      </div>

      <!-- unterer Abschnitt: Termin -->
      <div style="padding: 46px 48px 42px 48px; display: flex; flex-direction: column; gap: 26px;">
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0;">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 0 10px;">
            <div style="font-size: 17px; font-weight: 300; color: rgba(255,255,255,.4); letter-spacing: 5px; text-transform: uppercase;">Tag</div>
            <div style="font-size: 46px; font-weight: 500; color: #ffffff; line-height: 1; letter-spacing: 1px;">FREITAG</div>
          </div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 0 10px; border-left: 1px solid rgba(255,255,255,.10); border-right: 1px solid rgba(255,255,255,.10);">
            <div style="font-size: 17px; font-weight: 300; color: rgba(255,255,255,.4); letter-spacing: 5px; text-transform: uppercase;">Datum</div>
            <div style="font-size: 58px; font-weight: 600; color: #ffcc33; line-height: 1; letter-spacing: 1px;">11.09.</div>
          </div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 0 10px;">
            <div style="font-size: 17px; font-weight: 300; color: rgba(255,255,255,.4); letter-spacing: 5px; text-transform: uppercase;">Jahr</div>
            <div style="font-size: 46px; font-weight: 500; color: #ffffff; line-height: 1; letter-spacing: 1px;">2026</div>
          </div>
        </div>
        <div style="text-align: center; font-size: 20px; font-weight: 300; color: rgba(255,255,255,.45); letter-spacing: 7px; text-transform: uppercase;">jeden 2. Freitag</div>
      </div>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
