<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&display=swap">
  <style>
    body { margin: 0; background: #060606; }
    a { color: #ffcc33; } a:hover { color: #e63030; }
  </style>
</helmet>

<div style="width: 1080px; height: 1350px; position: relative; overflow: hidden; background: radial-gradient(ellipse at 30% 0%, #12291a 0%, #060c08 55%, #050505 100%); font-family: 'Oswald', 'Liberation Sans', sans-serif;">

  <div style="position: absolute; top: 0; left: 0; right: 0; height: 8px; background: linear-gradient(90deg, #1a7a2e 0%, #2db84a 30%, #b22222 70%, #e63030 100%); z-index: 30;"></div>

  <div style="position: absolute; inset: 8px 0 0 0; display: flex; flex-direction: column; align-items: center; padding: 60px 68px 54px 68px;">

    <div style="display: flex; align-items: center; gap: 16px;">
      <img src="logo.png" alt="TSV Pilsting e.V." style="width: 44px; height: 44px; object-fit: contain;">
      <div style="font-size: 18px; font-weight: 400; color: rgba(255,255,255,.55); letter-spacing: 6px;">TSV PILSTING DART PRÄSENTIERT</div>
    </div>

    <div style="margin-top: 40px; font-size: 20px; font-weight: 600; color: #2db84a; letter-spacing: 12px;">1. AUSGABE</div>

    <div style="margin-top: 8px; font-family: 'Anton', 'Oswald', sans-serif; text-transform: uppercase; text-align: center; line-height: .92;">
      <div style="font-size: 108px; color: #ffcc33;">Dart</div>
      <div style="font-size: 108px; color: #ffffff;">Competition</div>
    </div>

    <div style="width: 220px; height: 3px; background: linear-gradient(90deg, transparent, #2db84a, transparent); margin: 34px 0;"></div>

    <!-- Infoliste -->
    <div style="width: 100%; display: flex; flex-direction: column; gap: 42px; margin-top: 12px;">

      <div style="display: flex; align-items: center; gap: 22px;">
        <div style="width: 56px; height: 56px; border-radius: 50%; background: rgba(45,184,74,.14); border: 1px solid rgba(45,184,74,.4); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2db84a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <div style="font-size: 17px; font-weight: 600; color: #2db84a; letter-spacing: 3px;">DATUM</div>
          <div style="font-size: 27px; font-weight: 500; color: #ffffff;">Freitag, 11.09.2026</div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 22px;">
        <div style="width: 56px; height: 56px; border-radius: 50%; background: rgba(45,184,74,.14); border: 1px solid rgba(45,184,74,.4); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2db84a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/>
          </svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <div style="font-size: 17px; font-weight: 600; color: #2db84a; letter-spacing: 3px;">UHRZEIT</div>
          <div style="font-size: 27px; font-weight: 500; color: #ffffff;">[UHRZEIT EINTRAGEN]</div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 22px;">
        <div style="width: 56px; height: 56px; border-radius: 50%; background: rgba(45,184,74,.14); border: 1px solid rgba(45,184,74,.4); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2db84a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>
          </svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <div style="font-size: 17px; font-weight: 600; color: #2db84a; letter-spacing: 3px;">ORT</div>
          <div style="font-size: 27px; font-weight: 500; color: #ffffff;">[ORT EINTRAGEN]</div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 22px;">
        <div style="width: 56px; height: 56px; border-radius: 50%; background: rgba(45,184,74,.14); border: 1px solid rgba(45,184,74,.4); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2db84a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
          </svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <div style="font-size: 17px; font-weight: 600; color: #2db84a; letter-spacing: 3px;">TURNUS</div>
          <div style="font-size: 27px; font-weight: 500; color: #ffffff;">jeden 2. Freitag im Monat</div>
        </div>
      </div>

    </div>

    <div style="flex-grow: 1;"></div>

    <!-- Dartscheibe unten rechts, anschneidend -->
    <div style="position: absolute; right: -130px; bottom: -130px; width: 620px; height: 620px; z-index: 2;">
      <div style="position: absolute; inset: -60px; border-radius: 50%; background: radial-gradient(circle, rgba(45,184,74,.14) 0%, transparent 68%);"></div>
      <div style="position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 -20px 70px rgba(0,0,0,.5);"></div>
      <div style="position: absolute; inset: 0; border-radius: 50%; background: #131313; border: 8px solid #1c1c1c;"></div>
      <div style="position: absolute; inset: 12px; border-radius: 50%; background: conic-gradient(from 9deg,
        #f2ead9 0deg 18deg, #171310 18deg 36deg, #f2ead9 36deg 54deg, #171310 54deg 72deg,
        #f2ead9 72deg 90deg, #171310 90deg 108deg, #f2ead9 108deg 126deg, #171310 126deg 144deg,
        #f2ead9 144deg 162deg, #171310 162deg 180deg, #f2ead9 180deg 198deg, #171310 198deg 216deg,
        #f2ead9 216deg 234deg, #171310 234deg 252deg, #f2ead9 252deg 270deg, #171310 270deg 288deg,
        #f2ead9 288deg 306deg, #171310 306deg 324deg, #f2ead9 324deg 342deg, #171310 342deg 360deg); opacity: .92;"></div>
      <div style="position: absolute; inset: 12px; border-radius: 50%; background: conic-gradient(from 9deg,
        #2db84a 0deg 18deg, #c81f2e 18deg 36deg, #2db84a 36deg 54deg, #c81f2e 54deg 72deg,
        #2db84a 72deg 90deg, #c81f2e 90deg 108deg, #2db84a 108deg 126deg, #c81f2e 126deg 144deg,
        #2db84a 144deg 162deg, #c81f2e 162deg 180deg, #2db84a 180deg 198deg, #c81f2e 198deg 216deg,
        #2db84a 216deg 234deg, #c81f2e 234deg 252deg, #2db84a 252deg 270deg, #c81f2e 270deg 288deg,
        #2db84a 288deg 306deg, #c81f2e 306deg 324deg, #2db84a 324deg 342deg, #c81f2e 342deg 360deg);
        -webkit-mask: radial-gradient(circle, transparent 0 55%, #000 55% 64%, transparent 64% 100%);
        mask: radial-gradient(circle, transparent 0 55%, #000 55% 64%, transparent 64% 100%); opacity: .92;"></div>
      <div style="position: absolute; inset: 12px; border-radius: 50%; background: conic-gradient(from 9deg,
        #2db84a 0deg 18deg, #c81f2e 18deg 36deg, #2db84a 36deg 54deg, #c81f2e 54deg 72deg,
        #2db84a 72deg 90deg, #c81f2e 90deg 108deg, #2db84a 108deg 126deg, #c81f2e 126deg 144deg,
        #2db84a 144deg 162deg, #c81f2e 162deg 180deg, #2db84a 180deg 198deg, #c81f2e 198deg 216deg,
        #2db84a 216deg 234deg, #c81f2e 234deg 252deg, #2db84a 252deg 270deg, #c81f2e 270deg 288deg,
        #2db84a 288deg 306deg, #c81f2e 306deg 324deg, #2db84a 324deg 342deg, #c81f2e 342deg 360deg);
        -webkit-mask: radial-gradient(circle, transparent 0 89%, #000 89% 98%, transparent 98% 100%);
        mask: radial-gradient(circle, transparent 0 89%, #000 89% 98%, transparent 98% 100%); opacity: .92;"></div>
      <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 74px; height: 74px; border-radius: 50%; background: #2db84a;"></div>
      <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 30px; height: 30px; border-radius: 50%; background: #e63030; box-shadow: 0 0 22px rgba(230,48,48,.55);"></div>

      <!-- Dart, steckt im Bull -->
      <svg width="150" height="46" viewBox="0 0 150 46" style="position: absolute; left: 50%; top: 50%; transform: translate(-6px, -6px) rotate(-18deg); filter: drop-shadow(0 6px 10px rgba(0,0,0,.5));">
        <polygon points="0,23 16,17 16,29" fill="#e4e4e4"/>
        <rect x="16" y="15" width="48" height="16" rx="4" fill="#9a9a9a"/>
        <line x1="26" y1="15" x2="26" y2="31" stroke="#6b6b6b" stroke-width="1.5"/>
        <line x1="36" y1="15" x2="36" y2="31" stroke="#6b6b6b" stroke-width="1.5"/>
        <line x1="46" y1="15" x2="46" y2="31" stroke="#6b6b6b" stroke-width="1.5"/>
        <line x1="56" y1="15" x2="56" y2="31" stroke="#6b6b6b" stroke-width="1.5"/>
        <rect x="64" y="19" width="36" height="8" fill="#242424"/>
        <polygon points="100,9 150,2 122,23" fill="#ffcc33"/>
        <polygon points="100,37 150,44 122,23" fill="#cc9f1f"/>
      </svg>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
